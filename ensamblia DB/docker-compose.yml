services:
  db:
    image: postgres:17
    container_name: ensamblia_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - ./ensamblia_db:/var/lib/postgresql/data
    networks:
      - ensamblia_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_ensamblia
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8081:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
      - ./pgadmin/pgpass:/pgpass
    depends_on:
      - db
    networks:
      - ensamblia_net

  redis:
    image: redis:7-alpine
    container_name: ensamblia_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - ensamblia_net

  minio:
    image: pgsty/silo:latest
    container_name: ensamblia_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data
    networks:
      - ensamblia_net

  minio-init:
    image: pgsty/silo:latest
    container_name: ensamblia_minio_init
    depends_on:
      - minio
    volumes:
      - ./minio-policy.json:/minio-policy.json:ro
    entrypoint: >
      /bin/sh -c " echo 'Esperando a MinIO...'; sleep 5; /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; /usr/bin/mc mb --ignore-existing local/${MINIO_BUCKET_NAME}; echo 'Aplicando policy selectiva: multimedia/* público, chat/* privado...'; /usr/bin/mc anonymous set-json /minio-policy.json local/${MINIO_BUCKET_NAME}; echo 'Bucket ${MINIO_BUCKET_NAME} listo (multimedia/* PÚBLICO, chat/* PRIVADO).'; exit 0; "
    networks:
      - ensamblia_net

networks:
  ensamblia_net:
