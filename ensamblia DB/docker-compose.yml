services:
  db:
    image: postgres:17
    container_name: ensamblia_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - ./ensamblia_db:/var/lib/postgresql/data
    networks:
      - ensamblia_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_ensamblia
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8081:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
      - ./pgadmin/pgpass:/pgpass
    depends_on:
      - db
    networks:
      - ensamblia_net

  redis:
    image: redis:7-alpine
    container_name: ensamblia_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - ensamblia_net

networks:
  ensamblia_net:
