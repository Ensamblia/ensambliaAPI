services:
  db:
    image: postgres:17
    container_name: ensamblia_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # Volumen Docker nativo, no bind mount: en WSL un bind mount a /mnt/c
      # falla con "wrong ownership" (ver GUIA_EQUIPO.md #4, mismo tipo de bug que nodemon).
      - ensamblia_pgdata:/var/lib/postgresql/data
    networks:
      - ensamblia_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_ensamblia
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
      - ./pgadmin/pgpass:/pgpass
    depends_on:
      - db
    networks:
      - ensamblia_net

networks:
  ensamblia_net:

volumes:
  ensamblia_pgdata:
    name: ensamblia_pgdata
